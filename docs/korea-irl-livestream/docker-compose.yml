# ══════════════════════════════════════════════════════════════════════
#  Relais multistream IRL — nginx-rtmp + stunnel (pour Kick en RTMPS)
#
#  Reçoit UN flux (depuis ton encodeur via le tunnel SpeedFusion/FusionHub)
#  et le renvoie SIMULTANÉMENT vers Twitch + YouTube + Kick.
# ══════════════════════════════════════════════════════════════════════

services:
  # ── Relais RTMP : ingest unique -> fan-out multi-plateformes ──
  rtmp-relay:
    image: tiangolo/nginx-rtmp
    container_name: irl-rtmp-relay
    restart: unless-stopped
    ports:
      - "1935:1935"      # RTMP ingest (ton encodeur publie ici)
      - "8080:80"        # page de stats : http://VPS_IP:8080/stat
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kick-tls

  # ── stunnel : Kick exige du RTMPS (TLS), nginx-rtmp ne fait que du RTMP ──
  #  nginx pousse en clair vers stunnel:1936 -> stunnel chiffre vers Kick.
  kick-tls:
    image: dweomer/stunnel
    container_name: irl-kick-tls
    restart: unless-stopped
    environment:
      - STUNNEL_SERVICE=kick
      - STUNNEL_CLIENT=yes
      - STUNNEL_ACCEPT=0.0.0.0:1936
      # Renseigne l'hôte d'ingest Kick que TON dashboard t'a donné
      # (ex : fa723fc1b171.global-contribute.live-video.net:443)
      - STUNNEL_CONNECT=${KICK_INGEST_HOST}:443
